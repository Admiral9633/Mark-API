version: '3.8'

services:
  # PostgreSQL Datenbank (leichter als MySQL)
  db:
    image: postgres:16-alpine
    container_name: pdf_ocr_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pdf_ocr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_password_123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - pdf_ocr_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdf_ocr_backend
    restart: unless-stopped
    command: >
      sh -c "pip install watchdog &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app:cached
      - backend_static:/app/staticfiles
      - media_files:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-docker-dev-key
      - DATABASE_URL=postgresql://postgres:secure_password_123@db:5432/pdf_ocr
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://192.168.178.84:3000
      - MARKER_API_URL=http://marker-api:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pdf_ocr_network

  # Marker-API für OCR (AI-Modelle)
  marker-api:
    build:
      context: .
      dockerfile: Dockerfile.marker-api
    container_name: pdf_ocr_marker
    restart: unless-stopped
    environment:
      - TORCH_DEVICE=cpu  # Nutze 'cuda' falls GPU verfügbar
      - MARKER_USE_GPU=0
    volumes:
      - marker_cache:/root/.cache
    ports:
      - "8001:8000"
    networks:
      - pdf_ocr_network
    deploy:
      resources:
        reservations:
          memory: 6G
        limits:
          memory: 12G
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: pdf_ocr_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://192.168.178.84:8000
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - pdf_ocr_network
    command: npm run dev

volumes:
  postgres_data:
  marker_cache:
  media_files:
  backend_static:

networks:
  pdf_ocr_network:
    driver: bridge
