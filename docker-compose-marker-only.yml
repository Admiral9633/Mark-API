version: '3.8'

services:
  # Nur Marker-API für OCR
  marker-api:
    image: ghcr.io/adithya-s-k/marker-api:latest
    container_name: pdf_ocr_marker
    restart: unless-stopped
    environment:
      - TORCH_DEVICE=cpu  # Ändere zu 'cuda' falls GPU vorhanden
      - MARKER_USE_GPU=0
    volumes:
      - marker_cache:/root/.cache
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          memory: 6G
        limits:
          memory: 12G
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  marker_cache:
    driver: local
